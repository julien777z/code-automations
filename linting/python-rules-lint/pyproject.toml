[project]
name = "python-rules-lint"
version = "0.1.0"
description = "Pylint checks for shared Python repository conventions."
requires-python = ">=3.13,<3.14"
dependencies = ["pylint>=4.0.6,<5"]

[tool.poetry]
packages = [{ include = "python_rules_lint", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.0,<9"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
