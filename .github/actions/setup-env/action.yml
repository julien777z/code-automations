name: Set Up Environment
description: Set up Python, Poetry, and project dependencies.

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.13"
runs:
  using: composite
  steps:
    - name: Set Up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Poetry
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/poetry"
        "$RUNNER_TEMP/poetry/bin/python" -m pip install --disable-pip-version-check poetry
        mkdir -p "$RUNNER_TEMP/poetry-bin"
        ln -sf "$RUNNER_TEMP/poetry/bin/poetry" "$RUNNER_TEMP/poetry-bin/poetry"
        echo "$RUNNER_TEMP/poetry-bin" >> "$GITHUB_PATH"
    - name: Show Tool Versions
      shell: bash
      run: |
        python --version
        poetry --version
    - name: Install Project Dependencies
      shell: bash
      run: poetry install
