name: Cloud Automations
description: Validate and dispatch Codex Cloud automations from a repository-owned YAML file.
author: julien777z

branding:
  icon: cloud
  color: blue

inputs:
  config-path:
    description: Path to the automation configuration relative to the checked-out repository.
    required: false
    default: automations.yaml
  mode:
    description: Operation to run — validate or dispatch.
    required: false
    default: dispatch
  automation:
    description: Globally unique automation name for manual dispatch. Empty dispatches scheduled automations.
    required: false
    default: ""
  codex-auth-json:
    description: Complete Codex auth.json generated by `codex login` for ChatGPT subscription access.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate action inputs
      shell: bash
      env:
        AUTOMATION_MODE: ${{ inputs.mode }}
        CODEX_AUTH_JSON: ${{ inputs.codex-auth-json }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        set -euo pipefail

        case "$AUTOMATION_MODE" in
          validate) ;;
          dispatch)
            test -n "$CODEX_AUTH_JSON" || {
              echo "codex-auth-json is required in dispatch mode" >&2
              exit 1
            }
            ;;
          *)
            echo "mode must be validate or dispatch" >&2
            exit 1
            ;;
        esac

        test -f "$GITHUB_WORKSPACE/$CONFIG_PATH" || {
          echo "configuration file does not exist: $CONFIG_PATH" >&2
          exit 1
        }
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ${{ github.action_path }}/.python-version
    - name: Install Cloud Automations
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"
    - name: Validate automation configuration
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
      run: cloud-automations --config "$GITHUB_WORKSPACE/$CONFIG_PATH" validate
    - name: Read Node version
      id: node-version
      if: inputs.mode == 'dispatch'
      shell: bash
      run: printf 'value=%s\n' "$(< "$GITHUB_ACTION_PATH/.nvmrc")" >> "$GITHUB_OUTPUT"
    - name: Set up Node
      if: inputs.mode == 'dispatch'
      uses: actions/setup-node@v4
      with:
        # setup-node resolves node-version-file against the caller workspace, not GITHUB_ACTION_PATH.
        node-version: ${{ steps.node-version.outputs.value }}
    - name: Install Codex CLI
      if: inputs.mode == 'dispatch'
      shell: bash
      run: |
        npm ci --prefix "$GITHUB_ACTION_PATH"
        printf '%s\n' "$GITHUB_ACTION_PATH/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Load scheduled automation state
      if: inputs.mode == 'dispatch' && inputs.automation == ''
      shell: bash
      run: |
        state_ref="$(git ls-remote --heads origin automation-state)"
        if [ -n "$state_ref" ]; then
          git fetch origin automation-state:refs/remotes/origin/automation-state
          git show origin/automation-state:state.json > "$RUNNER_TEMP/state.json"
        else
          printf '{"version":1,"successful":{}}\n' > "$RUNNER_TEMP/state.json"
        fi
    - name: Set up Codex authentication
      if: inputs.mode == 'dispatch'
      shell: bash
      env:
        CODEX_AUTH_JSON: ${{ inputs.codex-auth-json }}
      run: |
        codex_home="$RUNNER_TEMP/codex-home"
        install -d -m 700 "$codex_home"
        printf '%s' "$CODEX_AUTH_JSON" > "$codex_home/auth.json"
        chmod 600 "$codex_home/auth.json"
        printf 'CODEX_HOME=%s\n' "$codex_home" >> "$GITHUB_ENV"
    - name: Dispatch automations
      id: dispatch
      if: inputs.mode == 'dispatch'
      shell: bash
      env:
        AUTOMATION: ${{ inputs.automation }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        if [ -n "$AUTOMATION" ]; then
          cloud-automations --config "$GITHUB_WORKSPACE/$CONFIG_PATH" dispatch --automation "$AUTOMATION"
        else
          cloud-automations --config "$GITHUB_WORKSPACE/$CONFIG_PATH" dispatch --scheduled --state "$RUNNER_TEMP/state.json"
        fi
    - name: Persist scheduled automation state
      if: always() && inputs.mode == 'dispatch' && inputs.automation == '' && steps.dispatch.outcome != 'skipped'
      shell: bash
      run: |
        state_directory="$RUNNER_TEMP/automation-state"
        if git show-ref --verify --quiet refs/remotes/origin/automation-state; then
          git worktree add -B automation-state "$state_directory" origin/automation-state
        else
          git worktree add --detach "$state_directory"
          git -C "$state_directory" checkout --orphan automation-state
          git -C "$state_directory" rm -rf .
        fi
        cp "$RUNNER_TEMP/state.json" "$state_directory/state.json"
        git -C "$state_directory" add state.json
        if git -C "$state_directory" diff --cached --quiet; then
          exit 0
        fi
        git -C "$state_directory" config user.name github-actions[bot]
        git -C "$state_directory" config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git -C "$state_directory" commit -m "Update automation state"
        git -C "$state_directory" push origin HEAD:automation-state
