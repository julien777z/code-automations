name: Code Automations
description: Validate and run multi-repository automations from a repository-owned YAML file.
author: julien777z

branding:
  icon: play
  color: blue

inputs:
  automations-file-path:
    description: Path to the automation configuration relative to the checked-out repository.
    required: false
    default: automations.yaml
  mode:
    description: Operation to run — validate or dispatch.
    required: false
    default: dispatch
  run-automation:
    description: Globally unique automation name for manual dispatch. Empty dispatches scheduled automations.
    required: false
    default: ""
  codex-auth-json:
    description: Complete Codex authentication document required to run automations.
    required: false
    default: ""
  github-token:
    description: GitHub token with access to every configured repository.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate Action Inputs
      shell: bash
      env:
        AUTOMATION_MODE: ${{ inputs.mode }}
        AUTOMATIONS_FILE_PATH: ${{ inputs.automations-file-path }}
        CODEX_AUTH_JSON: ${{ inputs.codex-auth-json }}
        AUTOMATION_GITHUB_TOKEN: ${{ inputs.github-token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF: ${{ github.ref }}
      run: |
        set -euo pipefail

        case "$AUTOMATION_MODE" in
          validate) ;;
          dispatch)
            case "$GITHUB_EVENT_NAME" in
              schedule|workflow_dispatch) ;;
              *)
                echo "dispatch is only allowed for scheduled and manual workflow runs" >&2
                exit 1
                ;;
            esac
            test -n "$CODEX_AUTH_JSON" || {
              echo "codex-auth-json is required in dispatch mode" >&2
              exit 1
            }
            test -n "$AUTOMATION_GITHUB_TOKEN" || {
              echo "github-token is required in dispatch mode" >&2
              exit 1
            }
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || {
              echo "dispatch is only allowed from the default branch" >&2
              exit 1
            }
            ;;
          *)
            echo "mode must be validate or dispatch" >&2
            exit 1
            ;;
        esac

        workspace_root="$(realpath "$GITHUB_WORKSPACE")"
        automation_file_path="$(realpath -m -- "$workspace_root/$AUTOMATIONS_FILE_PATH")"

        case "$automation_file_path" in
          "$workspace_root"/*) ;;
          *)
            echo "automation file must resolve inside the checked-out repository" >&2
            exit 1
            ;;
        esac

        test -f "$automation_file_path" || {
          echo "automation file does not exist: $AUTOMATIONS_FILE_PATH" >&2
          exit 1
        }

        git config --local --unset-all http.https://github.com/.extraheader || true
    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ${{ github.action_path }}/.python-version
    - name: Install Action Dependencies
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check poetry==2.2.0
        poetry --directory "$GITHUB_ACTION_PATH" install --only main
    - name: Build Automation Runner
      if: inputs.mode == 'dispatch'
      shell: bash
      run: |
        image="code-automations-runner:$GITHUB_RUN_ID"
        docker build --file "$GITHUB_ACTION_PATH/docker/Dockerfile" --tag "$image" "$GITHUB_ACTION_PATH"
        printf 'AUTOMATION_RUNNER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
        printf 'AUTOMATION_RUNNER_USER=%s:%s\n' "$(id -u)" "$(id -g)" >> "$GITHUB_ENV"
    - name: Validate Automation File
      shell: bash
      env:
        AUTOMATIONS_FILE_PATH: ${{ inputs.automations-file-path }}
      run: poetry --directory "$GITHUB_ACTION_PATH" run code-automations --config "$GITHUB_WORKSPACE/$AUTOMATIONS_FILE_PATH" validate
    - name: Load Scheduled Automation State
      if: inputs.mode == 'dispatch' && inputs.run-automation == ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        credentials=(
          -c credential.helper=
          -c 'credential.https://github.com.helper=!gh auth git-credential'
        )
        state_ref="$(git "${credentials[@]}" ls-remote --heads "https://github.com/$GITHUB_REPOSITORY.git" automation-state)"
        if [ -n "$state_ref" ]; then
          git "${credentials[@]}" fetch "https://github.com/$GITHUB_REPOSITORY.git" automation-state:refs/remotes/origin/automation-state
          git show origin/automation-state:state.json > "$RUNNER_TEMP/state.json"
        else
          printf '{"version":1,"successful":{}}\n' > "$RUNNER_TEMP/state.json"
        fi
    - name: Set Up Automation Authentication
      id: authentication
      if: inputs.mode == 'dispatch'
      shell: bash
      env:
        CODEX_AUTH_JSON: ${{ inputs.codex-auth-json }}
      run: |
        authentication_home="$RUNNER_TEMP/automation-authentication"
        github_home="$RUNNER_TEMP/automation-github-home"
        install -d -m 700 "$authentication_home"
        install -d -m 700 "$github_home"
        printf '%s' "$CODEX_AUTH_JSON" > "$authentication_home/auth.json"
        chmod 600 "$authentication_home/auth.json"
        unset CODEX_AUTH_JSON
        printf 'home=%s\n' "$authentication_home" >> "$GITHUB_OUTPUT"
        printf 'github-home=%s\n' "$github_home" >> "$GITHUB_OUTPUT"
    - name: Run Automations
      id: dispatch
      if: inputs.mode == 'dispatch'
      shell: bash
      env:
        AUTOMATION_GITHUB_TOKEN: ${{ inputs.github-token }}
        AUTOMATION_CODEX_HOME: ${{ steps.authentication.outputs.home }}
        AUTOMATION_GITHUB_HOME: ${{ steps.authentication.outputs.github-home }}
        AUTOMATIONS_FILE_PATH: ${{ inputs.automations-file-path }}
        RUN_AUTOMATION: ${{ inputs.run-automation }}
      run: |
        export AUTOMATION_COMMAND_PATH="$PATH"
        if [ -n "$RUN_AUTOMATION" ]; then
          poetry --directory "$GITHUB_ACTION_PATH" run code-automations --config "$GITHUB_WORKSPACE/$AUTOMATIONS_FILE_PATH" dispatch --automation "$RUN_AUTOMATION"
        else
          poetry --directory "$GITHUB_ACTION_PATH" run code-automations --config "$GITHUB_WORKSPACE/$AUTOMATIONS_FILE_PATH" dispatch --scheduled --state "$RUNNER_TEMP/state.json"
        fi
    - name: Persist Scheduled Automation State
      if: always() && inputs.mode == 'dispatch' && inputs.run-automation == '' && steps.dispatch.outcome != 'skipped'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        credentials=(
          -c credential.helper=
          -c 'credential.https://github.com.helper=!gh auth git-credential'
        )
        state_directory="$RUNNER_TEMP/automation-state"
        if git show-ref --verify --quiet refs/remotes/origin/automation-state; then
          git worktree add -B automation-state "$state_directory" origin/automation-state
        else
          git worktree add --detach "$state_directory"
          git -C "$state_directory" checkout --orphan automation-state
          git -C "$state_directory" rm -rf .
        fi
        cp "$RUNNER_TEMP/state.json" "$state_directory/state.json"
        git -C "$state_directory" add state.json
        if git -C "$state_directory" diff --cached --quiet; then
          exit 0
        fi
        git -C "$state_directory" config user.name github-actions[bot]
        git -C "$state_directory" config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git -C "$state_directory" commit -m "Update automation state"
        git -C "$state_directory" "${credentials[@]}" push "https://github.com/$GITHUB_REPOSITORY.git" HEAD:automation-state
    - name: Remove Automation Authentication
      if: always() && inputs.mode == 'dispatch'
      shell: bash
      run: rm -rf "${{ steps.authentication.outputs.home }}" "${{ steps.authentication.outputs.github-home }}"
