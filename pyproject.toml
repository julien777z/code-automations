[project]
name = "cloud-automations"
version = "0.1.0"
description = "Schedule reusable Codex Cloud automations from GitHub Actions."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
cloud-automations = "cloud_automations.cli:main"

[tool.poetry]
packages = [{ include = "cloud_automations", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
croniter = ">=6.0.0,<7"
pydantic = ">=2.11.0,<3"
pydantic-settings = ">=2.10.0,<3"
pyyaml = ">=6.0.2,<7"
tzdata = ">=2025.2"

[tool.poetry.group.dev.dependencies]
python-rules-lint = { path = "linting/python-rules-lint", develop = true }
pytest = ">=8.4.0,<9"
ruff = ">=0.12.0,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests", "linting/python-rules-lint/tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pylint.main]
jobs = 1
load-plugins = ["python_rules_lint"]
source-roots = ["src", "linting/python-rules-lint/src"]

[tool.pylint.messages_control]
disable = ["all"]
enable = [
  "banned-python-terminology",
  "broad-exception-caught",
  "direct-environment-read",
  "forbidden-module-docstring",
  "forbidden-opening-comment",
  "forbidden-python-construct",
  "import-outside-toplevel",
  "invalid-leading-underscore",
  "missing-blank-line-after-docstring",
  "missing-definition-docstring",
  "multiline-definition-docstring",
  "parent-relative-import",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
