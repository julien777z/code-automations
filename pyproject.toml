[project]
name = "code-automations"
version = "0.0.1"
description = "Run reusable multi-repository automations from GitHub Actions."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
code-automations = "code_automations.__main__:main"

[tool.poetry]
packages = [{ include = "code_automations", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
croniter = ">=6.0.0,<7"
pydantic = ">=2.11.0,<3"
pydantic-settings = ">=2.10.0,<3"
pyyaml = ">=6.0.2,<7"
tzdata = ">=2025.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.0,<9"
ruff = ">=0.12.0,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
